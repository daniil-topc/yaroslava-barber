<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено · Ярослава, барбер</title>
<meta name="robots" content="noindex">
<script>
  // Сайт живе і в корені (Vercel), і в /yaroslava-barber/ (GitHub Pages): base підлаштовується під адресу
  (function () {
    var base = location.pathname.indexOf('/yaroslava-barber/') === 0 ? '/yaroslava-barber/' : '/';
    document.write('<base href="' + base + '">');
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
  })();
</script>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="hero-area" style="min-height:100vh;display:grid;place-items:center">
  <div class="glow" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="wrap final" style="padding-top:0">
    <p class="caption-1 muted">Помилка 404</p>
    <h1 class="heading-2">Такої сторінки немає</h1>
    <p class="body-7 muted">Можливо, посилання застаріло. Головна сторінка на місці.</p>
    <a class="btn btn--lg button-lg" href="./">На головну</a>
  </div>
</main>
</body>
</html>
